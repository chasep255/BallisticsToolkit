<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Remote Play Viewer — F-Class Simulator</title>
  <link rel="icon" type="image/x-icon" href="../ballistics-toolkit-favicon.ico">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="fclass-sim.css">
  <!-- Site chrome: nav header, footer + safety notice, consent (same as other pages) -->
  <script src="../common.js"></script>
  <style>
    .rp-connect { max-width: 640px; margin: 12px auto; padding: 14px 16px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa; text-align: center; }
    .rp-stage { display: none; position: relative; }
    .rp-stage.active { display: block; }
    /* Show at the host's captured resolution (centered); only scale down to fit
       the viewport — don't stretch to fill the window. */
    #remoteVideo { display: inline-block; max-width: 100%; max-height: calc(100vh - 150px); background: #000; border-radius: 6px; }
    .rp-status { font-size: 14px; font-weight: bold; color: #333; }
    .rp-bar { display:flex; gap:10px; align-items:center; justify-content:center; margin: 10px 0; flex-wrap: wrap; }
    .rp-hint { color:#666; font-size: 12px; text-align:center; }
  </style>
</head>
<body data-page="remote">
  <div class="nav-header"></div>
  <div class="app-container">
    <h1>🎮 F-Class Simulator</h1>
    <p style="text-align:center; margin-top:-12px; color:#666;">Remote Play <span style="color:#b06000;">(Beta)</span></p>

    <!-- Connection stage -->
    <div id="connectStage" class="rp-stage active">
      <div class="rp-connect">
        <div id="connectStatus" class="rp-status">Connecting to host&hellip;</div>
      </div>
    </div>

    <!-- Play stage -->
    <div id="playStage" class="rp-stage">
      <div class="rp-bar">
        <button id="rpPauseBtn" class="btn btn-secondary">Pause</button>
        <button id="rpScorecardBtn" class="btn btn-secondary">Scorecard</button>
        <button id="rpGoForRecordBtn" class="btn btn-primary" style="display:none;">Go For Record</button>
        <button id="rpWindHudBtn" class="btn btn-secondary">Show Wind HUD</button>
        <button id="rpSoundBtn" class="btn btn-secondary">🔊 Enable sound</button>
      </div>
      <div class="canvas-wrap">
        <div style="position: relative;">
          <video id="remoteVideo" autoplay playsinline muted></video>
          <!-- Slim, non-darkening notice. The same invite link reconnects you. -->
          <div id="dcBanner" style="display:none; position:absolute; top:0; left:0; right:0; background:rgba(176,96,0,0.92); color:#fff; padding:8px 12px; font-size:14px; text-align:center; border-radius:6px 6px 0 0;">
            Connection lost — reopen your invite link to rejoin.
          </div>
        </div>
      </div>
      <!-- Keyboard legend + simulation disclaimer below the view, like the host -->
      <div class="quick-keys" id="keyLegend"></div>
    </div>
  </div>

  <!-- Reused scorecard modal (rendered by ui/scorecard.js from pushed models) -->
  <div id="scorecardModal" class="scorecard-modal" style="display: none;">
    <div class="scorecard-content"></div>
  </div>

  <script type="module">
    import { PeerJSLink } from './core/peer-link.js';
    import { Scorecard } from './ui/scorecard.js';
    import { KEY_LEGEND_HTML, SIM_DISCLAIMER_HTML } from './ui/key-legend.js';

    const link = new PeerJSLink();
    const scorecard = new Scorecard();
    scorecard.initialize();

    // Shared keyboard legend + simulation disclaimer (same source as the host).
    document.getElementById('keyLegend').innerHTML = KEY_LEGEND_HTML + SIM_DISCLAIMER_HTML;

    const $ = (id) => document.getElementById(id);
    const setConnStatus = (t) => { $('connectStatus').textContent = t; };

    // ---- Inbound media + messages ----
    link.onStream = (stream) => { $('remoteVideo').srcObject = stream; };

    link.onOpen = () =>
    {
      $('connectStage').classList.remove('active');
      $('playStage').classList.add('active');
      $('dcBanner').style.display = 'none';
    };
    link.onClose = () => { $('dcBanner').style.display = 'block'; };
    link.onError = (err) =>
    {
      const type = err && err.type;
      if (type === 'peer-unavailable')
      {
        setConnStatus('Host not found. Make sure they have "Host Remote Play" enabled, then reopen the link they sent.');
      }
      else
      {
        setConnStatus('Connection error: ' + (type || (err && err.message) || err));
      }
    };

    link.onMessage = (msg) =>
    {
      if (!msg) return;
      if (msg.type === 'scorecard')
      {
        // Params + target geometry ride with the scorecard so the full card
        // (params block + grouping diagrams) renders identically to the host.
        if (msg.matchParams) scorecard.setMatchParams(msg.matchParams);
        if (msg.targetSpec) scorecard.setTargetSpec(msg.targetSpec);
        scorecard.update(msg.model);
      }
      else if (msg.type === 'controls')
      {
        // Show the viewer's Go For Record only on the viewer's own turn (p2)
        // while it still has sighters to skip — so it shows that player's button
        // and hides once pressed. (String fire has no active player id.)
        const btn = $('rpGoForRecordBtn');
        const show = msg.model && msg.model.goForRecord
          && (msg.activePlayer === 'p2' || msg.activePlayer == null);
        btn.style.display = show ? 'inline-block' : 'none';
        if (show && msg.model.goForRecordText) btn.textContent = msg.model.goForRecordText;
      }
      else if (msg.type === 'paused')
      {
        $('rpPauseBtn').textContent = msg.paused ? 'Resume' : 'Pause';
      }
      else if (msg.type === 'windHudState')
      {
        $('rpWindHudBtn').textContent = msg.visible ? 'Hide Wind HUD' : 'Show Wind HUD';
      }
      else if (msg.type === 'bye')
      {
        $('dcBanner').style.display = 'block';
      }
    };

    // ---- Local scorecard toggle (the modal is a DOM overlay, not in the video) ----
    $('rpScorecardBtn').addEventListener('click', () => scorecard.toggle());

    // ---- Sound toggle (starts muted: browsers block unmuted autoplay) ----
    $('rpSoundBtn').addEventListener('click', () =>
    {
      const v = $('remoteVideo');
      v.muted = !v.muted;
      if (!v.muted) v.play().catch(() => {});
      $('rpSoundBtn').textContent = v.muted ? '🔊 Enable sound' : '🔇 Mute';
    });

    // ---- Wind HUD — toggled on the host (its overlay shows in the stream) ----
    $('rpWindHudBtn').addEventListener('click', () =>
    {
      if (link.isOpen) link.send({ type: 'windHud' });
    });

    // ---- Go For Record (end sighters early) — sent to the host ----
    $('rpGoForRecordBtn').addEventListener('click', () =>
    {
      if (link.isOpen) link.send({ type: 'goForRecord' });
    });

    // ---- Pause/Resume — toggled on the host (label syncs via 'paused') ----
    $('rpPauseBtn').addEventListener('click', () =>
    {
      if (link.isOpen) link.send({ type: 'pause' });
    });

    // ---- Forward keystrokes to the host ----
    const GAME_KEYS = new Set([
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space',
      'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyE', 'KeyQ', 'KeyR',
      'Equal', 'Minus', 'NumpadAdd', 'NumpadSubtract'
    ]);

    function forwardKey(event)
    {
      if (!link.isOpen) return;
      if (GAME_KEYS.has(event.code)) event.preventDefault(); // stop page scroll/zoom
      link.send({
        type: 'input',
        key: event.key,
        code: event.code,
        shiftKey: event.shiftKey,
        isDown: event.type === 'keydown'
      });
    }
    document.addEventListener('keydown', forwardKey);
    document.addEventListener('keyup', forwardKey);

    // ---- Join the host's room from ?room=<id> ----
    const roomId = new URLSearchParams(window.location.search).get('room');
    if (!roomId)
    {
      setConnStatus('Open this page using the invite link your host sent you.');
    }
    else
    {
      setConnStatus('Connecting to host…');
      link.join(roomId).catch((err) =>
        setConnStatus('Could not connect: ' + ((err && err.type) || (err && err.message) || err)));
    }
  </script>
</body>
</html>
